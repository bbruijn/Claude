# Reserve-optie: hiermee genereer je het Xcode-project opnieuw met XcodeGen
# (`brew install xcodegen && xcodegen generate`) als IntervalTimer.xcodeproj
# niet opent in een oudere Xcode-versie.
name: IntervalTimer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  IntervalTimer:
    type: application
    platform: iOS
    sources:
      - IntervalTimer
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.intervaltimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
