name: Gesprekstool

# Test de gesprekstool en bouwt de pakketten voor macOS en Windows.
# De pakketten staan na afloop als 'artifact' bij de workflow-run.

on:
  push:
    paths:
      - 'gesprekstool/**'
      - '.github/workflows/gesprekstool.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gesprekstool-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vaste versies van de spraakherkenning en het taalmodel-programma.
  WHISPER_TAG: v1.9.5
  LLAMA_TAG: v1.0.0

jobs:
  tests:
    name: Tests (nagebootste onderdelen)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tkinter en virtueel beeldscherm
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-tk xvfb
      - name: Tests
        run: xvfb-run -a python3 -m unittest discover -s gesprekstool/tests -v

  modellen:
    name: Downloadadressen van de modellen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Controleer of elk adres bestaat
        run: |
          fout=0
          while IFS=$'\t' read -r sleutel bestand url; do
            code="$(curl -sIL -o /dev/null -w '%{http_code}' "$url")"
            echo "$code  $sleutel  $url"
            [ "$code" = "200" ] || fout=1
          done < <(grep -v '^#' gesprekstool/beheer/modellen.tsv)
          exit $fout

  pakket:
    name: Pakket ${{ matrix.naam }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, naam: macos-arm64 }
          - { os: windows-latest, naam: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: gesprekstool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Eerder gebouwde hulpprogramma's hergebruiken
        id: bin
        uses: actions/cache/restore@v4
        with:
          path: gesprekstool/bin
          key: bin-${{ matrix.naam }}-${{ env.WHISPER_TAG }}-${{ env.LLAMA_TAG }}-${{ hashFiles('gesprekstool/bouw/bouw-binaries.sh') }}

      - name: whisper.cpp en llama.cpp bouwen
        if: steps.bin.outputs.cache-hit != 'true'
        run: bouw/bouw-binaries.sh

      # Direct bewaren, zodat een latere mislukte stap het bouwwerk niet weggooit.
      - name: Gebouwde hulpprogramma's bewaren
        if: steps.bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gesprekstool/bin
          key: ${{ steps.bin.outputs.cache-primary-key }}

      - name: Programma bouwen (PyInstaller)
        run: |
          python -m pip install --quiet "pyinstaller>=6.6,<7" sounddevice
          python -m PyInstaller --noconfirm --distpath dist --workpath build/pyinstaller bouw/gesprekstool.spec

      - name: Pakket samenstellen
        run: bouw/maak-pakket.sh ${{ matrix.naam }}

      - name: Testmodellen hergebruiken
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rooktest/modellen
          key: rooktest-modellen-v1

      - name: Rooktest met het echte pakket
        run: bouw/rooktest.sh ${{ matrix.naam }}

      - name: Zip maken (macOS, behoudt rechten en handtekening)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "pakket/Gesprekstool-${{ matrix.naam }}" "pakket/Gesprekstool-${{ matrix.naam }}.zip"

      - name: Pakket bewaren (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Gesprekstool-${{ matrix.naam }}
          path: gesprekstool/pakket/Gesprekstool-${{ matrix.naam }}.zip
          if-no-files-found: error

      - name: Pakket bewaren (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Gesprekstool-${{ matrix.naam }}
          path: gesprekstool/pakket/Gesprekstool-${{ matrix.naam }}
          if-no-files-found: error
