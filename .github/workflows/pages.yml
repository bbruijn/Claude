name: Deploy Interval Timer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'interval-timer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laat een lopende publicatie afmaken, maar wachtrij van één.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true zet Pages aan als dat nog niet gebeurd is.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: interval-timer

      - id: deployment
        uses: actions/deploy-pages@v4
